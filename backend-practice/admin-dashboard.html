<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - UK Graphic Design</title>
    <style>
        body {
            background-color: #050b14;
            color: #ffffff;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            margin: 0;
            padding: 40px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 20px;
        }
        h2 {
            color: #1683ff;
            margin: 0;
        }
        button.logout-btn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button.logout-btn:hover {
            background-color: #e03b3b;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(22, 131, 255, 0.2);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        th {
            background-color: rgba(22, 131, 255, 0.1);
            color: #1683ff;
            font-weight: bold;
        }
        tr:hover {
            background-color: rgba(255, 255, 255, 0.03);
        }
        .wa-btn {
            background-color: #25d366;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            display: inline-block;
        }
        .wa-btn:hover {
            background-color: #1eb859;
        }
        .no-data {
            text-align: center;
            color: #a0aec0;
            padding: 40px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Client Enquiries Dashboard</h2>
        <button class="logout-btn" id="logout-btn">Log Out</button>
    </div>

    <div style="overflow-x: auto;">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Message</th>
                    <th>Received At</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="contacts-table-body">
                <tr>
                    <td colspan="6" class="no-data">Loading contacts...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        async function fetchContacts() {
            const tableBody = document.getElementById("contacts-table-body");
            try {
                const response = await fetch("http://localhost:3000/contacts", {
                    method: "GET",
                    credentials: "include" // Sends the session cookie along with the request
                });

                if (response.status === 401) {
                    // Haddii aysan session jirin, u celin login page-ka
                    window.location.href = "admin-login.html";
                    return;
                }

                if (!response.ok) {
                    throw new Error("Failed to fetch contacts.");
                }

                const contacts = await response.json();

                if (contacts.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="6" class="no-data">No messages received yet.</td></tr>`;
                    return;
                }

                tableBody.innerHTML = "";
                contacts.forEach(contact => {
                    const row = document.createElement("tr");
                    
                    // WhatsApp message template for quick reply
                    const whatsappText = encodeURIComponent(`Hello ${contact.name}, regarding your inquiry on UK Graphic Design: "${contact.message}"`);
                    const whatsappUrl = `https://wa.me/?text=${whatsappText}`;

                    row.innerHTML = `
                        <td>${contact.id}</td>
                        <td>${escapeHtml(contact.name)}</td>
                        <td><a href="mailto:${escapeHtml(contact.email)}" style="color: #1683ff; text-decoration: none;">${escapeHtml(contact.email)}</a></td>
                        <td>${escapeHtml(contact.message)}</td>
                        <td>${contact.created_at || 'N/A'}</td>
                        <td>
                            <a href="${whatsappUrl}" target="_blank" class="wa-btn">💬 Reply on WhatsApp</a>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            } catch (error) {
                console.error("Error loading contacts:", error);
                tableBody.innerHTML = `<tr><td colspan="6" class="no-data" style="color: #ff4d4d;">Error loading contact messages. Please ensure you are logged in.</td></tr>`;
            }
        }

        // Simple helper to prevent XSS injection when rendering user input in the dashboard
        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Real Backend Logout Handler
        document.getElementById("logout-btn").addEventListener("click", async () => {
            try {
                const res = await fetch("http://localhost:3000/admin/logout", {
                    method: "POST",
                    credentials: "include"
                });
                if (res.ok) {
                    window.location.href = "admin-login.html";
                } else {
                    alert("Logout failed.");
                }
            } catch (e) {
                alert("Server error during logout.");
            }
        });

        // Load contacts when the page opens
        fetchContacts();
    </script>

</body>
</html>
